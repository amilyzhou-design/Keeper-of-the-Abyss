<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>深渊牧光者 · Keeper of the Abyss</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 深海粒子背景画布 -->
  <canvas id="sea"></canvas>

  <aside class="journey-status" id="journey-status" hidden role="status">
    <p id="journey-message">旅程素材尚未加载完成，光群会在原处等候。</p>
    <button id="journey-retry" type="button">重试加载</button>
  </aside>
  <button class="bloom-sound" id="bloom-sound" type="button" hidden aria-pressed="true">节拍声音：开</button>
  <button class="ascension-mic" id="ascension-mic" type="button" hidden aria-pressed="false">启用拍手终闪</button>
  <output class="mic-feedback" id="mic-feedback" hidden>正在准备拍手检测…</output>

  <section class="journey-ending" id="journey-ending" hidden aria-labelledby="ending-title">
    <div class="ending-card">
      <p class="ending-kicker">KEEPER OF THE ABYSS / ECHOES</p>
      <h2 id="ending-title">光回到了海里</h2>
      <p class="ending-english">The light returns to the sea.</p>
      <div class="ending-rule"></div>
      <h3>牧光者回响</h3>
      <dl class="ending-stats">
        <div><dt>亲手唤醒</dt><dd id="ending-awakened">—</dd></div>
        <div><dt>穿越礁缝</dt><dd id="ending-gaps">—</dd></div>
        <div><dt>走过掠影</dt><dd id="ending-shadows">—</dd></div>
        <div><dt>繁衍至</dt><dd id="ending-population">—</dd></div>
      </dl>
      <p class="ending-duration" id="ending-duration"></p>
      <p class="ending-badge" id="ending-badge" hidden>采尘者 · 走过采尘深径</p>
      <p class="ending-keepsake">截图，带走这片光</p>
      <button id="ending-replay" type="button">再次入渊</button>
      <p class="ending-return">片刻后，海流会带你回到起点</p>
    </div>
  </section>

  <!-- 开屏内容 -->
  <main class="screen">
    <h1 class="title">
      <span class="title-line">KEEPER</span>
      <span class="title-line">OF&nbsp;THE&nbsp;ABYSS</span>
    </h1>

    <p class="subtitle">深渊牧光者</p>

    <p class="tagline">
      Herd the light of the deep sea<br>
      with your bare hands.
    </p>

    <button class="dive-btn" id="dive-btn" type="button" aria-label="Dive In">
      <span class="dive-text">DIVE&nbsp;IN</span>
    </button>
  </main>

  <!-- 捏合教学提示（开发期临时：接入捏合手势识别后可删除，见 sketch.js） -->
  <p class="pinch-hint" id="pinch-hint" aria-hidden="true">拇指 + 食指 · 轻轻捏合</p>

  <aside class="camera-status" id="camera-status" hidden aria-label="摄像头状态">
    <p id="camera-message" role="status" aria-live="polite"></p>
    <button id="camera-retry" type="button" hidden>重试摄像头</button>
  </aside>

  <section class="herd-hud" id="herd-hud" aria-label="放牧旅程" hidden>
    <div class="herd-heading">
      <span class="herd-chapter">02 / THE DESCENT</span>
      <h2 id="herd-title">放牧</h2>
    </div>
    <span class="herd-progress" id="herd-progress" aria-label="当前航道与旅程进度">0%</span>
    <p class="herd-cue" id="herd-cue" aria-live="polite"></p>
  </section>

  <!-- p5.js 按需加载；阶段三绘制光尘与力场，阶段四绘制蓄势星环、竖向光河和回响星图。 -->
  <script src="sketch.js"></script>
</body>
</html>
